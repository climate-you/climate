# Installed as /etc/systemd/journald.conf.d/climate.conf by
# scripts/deploy/install_ops.sh.
#
# journald's own default cap is 10% of the filesystem (about 4 GB on a 40 GB
# VM), which is a sizeable share of a disk the release data already fills.
# 500 MB is above what the logs use today (/var/log held about 300 MB in
# November 2026), so the cap only bites if something starts logging heavily.
[Journal]
SystemMaxUse=500M
